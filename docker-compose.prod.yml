# Środowisko PRODUKCYJNE.
#
# Uruchomienie:
#   cp .env.prod.example .env.prod && $EDITOR .env.prod
#   docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build
#
# Żadna usługa poza proxy nie publikuje portu na hosta. Postgres, Redis, API
# i obie aplikacje rozmawiają wyłącznie po wewnętrznej sieci dockerowej —
# z internetu widać tylko 80 i 443.
#
# Osobna nazwa projektu jest istotna: bez niej compose bierze ją z nazwy
# katalogu i produkcja dzieli wolumeny oraz sieć ze środowiskiem deweloperskim
# — `down -v` na jednym kasuje bazę drugiego.
name: kelbroo-prod

services:
  caddy:
    build:
      context: .
      dockerfile: deploy/Dockerfile.caddy
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    environment:
      GUEST_DOMAIN: ${GUEST_DOMAIN}
      ADMIN_DOMAIN: ${ADMIN_DOMAIN}
      # Domyślna wartość jest nierozwiązywalna celowo: wdrożenie bez własnej
      # domeny produktowej ma wstać normalnie, a nie wywrócić Caddy'ego na
      # pustym adresie serwera. Certyfikat dla .localhost wystawia CA wewnętrzne.
      LANDING_DOMAIN: ${LANDING_DOMAIN:-landing.localhost}
      # Zaplecze kelbroo. Domyślna wartość jest nierozwiązywalna celowo —
      # wdrożenie bez tej zmiennej po prostu go nie wystawia.
      BACKOFFICE_DOMAIN: ${BACKOFFICE_DOMAIN:-zaplecze.localhost}
      ACME_EMAIL: ${ACME_EMAIL}
    volumes:
      # Caddyfile jest wpieczony w obraz, nie montowany — patrz deploy/Dockerfile.caddy.
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - web-guest
      - web-admin
      - web-marketing
      - web-backoffice
      - api

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: kelbroo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: kelbroo
      APP_DB_PASSWORD: ${APP_DB_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init-prod.sh:/docker-entrypoint-initdb.d/10-roles.sh:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U kelbroo -d kelbroo']
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ['redis-server', '--requirepass', '${REDIS_PASSWORD}']
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli -a "$$REDIS_PASSWORD" ping | grep -q PONG']
      interval: 10s
      timeout: 5s
      retries: 10
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      API_PORT: 4000
      # Rola aplikacyjna podlega RLS. Migracje idą rolą bezpośrednią.
      DATABASE_URL: postgresql://kelbroo_app:${APP_DB_PASSWORD}@postgres:5432/kelbroo?schema=public
      DIRECT_DATABASE_URL: postgresql://kelbroo:${POSTGRES_PASSWORD}@postgres:5432/kelbroo?schema=public
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_ACCESS_TTL: ${JWT_ACCESS_TTL:-15m}
      JWT_REFRESH_TTL: ${JWT_REFRESH_TTL:-30d}
      GUEST_SESSION_SECRET: ${GUEST_SESSION_SECRET}
      GUEST_SESSION_TTL_HOURS: ${GUEST_SESSION_TTL_HOURS:-6}
      # Rejestracja otwarta od 2026-08-24, gdy powstały regulamin i polityka
      # prywatności. Zmienna zostaje jako wyłącznik awaryjny: `false` zamyka
      # zakładanie kont bez wdrażania czegokolwiek.
      REGISTRATION_ENABLED: ${REGISTRATION_ENABLED:-true}
      # Osobny sekret tokenu zaplecza. Bez niego logowanie tam odmawia —
      # i tak ma być, gdy ktoś zapomni zmiennej.
      ADMIN_JWT_SECRET: ${ADMIN_JWT_SECRET:-}
      # Poczta. Bez SMTP_HOST nic nie wychodzi na zewnątrz — wiadomości lądują
      # w logu, a rejestracja działa dalej. To celowe: brak poczty ma być
      # widoczny w logu, a nie wywracać zakładanie kont.
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-kelbroo <kontakt@kelbroo.com>}
      MAIL_NOTIFY: ${MAIL_NOTIFY:-kontakt@kelbroo.com}
      # Adres w odnośnikach wysyłanych do klientów.
      PUBLIC_SITE_URL: https://${LANDING_DOMAIN}
      # Panel, do którego wraca klient po zapłacie.
      PANEL_URL: https://${ADMIN_DOMAIN}
      # Adres, pod który operator płatności wysyła powiadomienie o wpłacie.
      # Musi być **publicznie osiągalny** — Caddy kieruje /api na tej domenie
      # do API, więc to ten sam origin co panel.
      PUBLIC_API_URL: https://${ADMIN_DOMAIN}/api
      # PayU. Bez kompletu tych zmiennych zakup abonamentu jest wyłączony,
      # a panel mówi o tym wprost zamiast pokazywać martwy przycisk „Zapłać".
      # `sandbox` do testów, `production` na koncie produkcyjnym — pomyłka
      # kieruje prawdziwe pieniądze do środowiska testowego albo odwrotnie.
      PAYU_ENV: ${PAYU_ENV:-sandbox}
      PAYU_POS_ID: ${PAYU_POS_ID:-}
      PAYU_CLIENT_ID: ${PAYU_CLIENT_ID:-}
      PAYU_CLIENT_SECRET: ${PAYU_CLIENT_SECRET:-}
      # Drugi klucz (MD5) — służy **wyłącznie** do sprawdzania podpisu
      # powiadomień. To on decyduje, czy komuś przedłużyć abonament.
      PAYU_SECOND_KEY: ${PAYU_SECOND_KEY:-}
      # Za proxy przeglądarka i tak nie przekracza originu, ale nagłówek Origin
      # przychodzi — musi być na liście, inaczej API odrzuci własne aplikacje.
      CORS_ORIGINS: https://${GUEST_DOMAIN},https://${ADMIN_DOMAIN}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      # API startuje dopiero po migracjach — inaczej pierwsze wdrożenie wpada
      # w pętlę restartów na pustym schemacie.
      migrate:
        condition: service_completed_successfully

  # Migracje jako osobne zadanie, nie w starcie API: przy kilku instancjach
  # backendu każda próbowałaby migrować równolegle.
  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      # Osobny cel: CLI Prismy jest devDependency i nie ma go w obrazie API.
      target: migrate
    restart: 'no'
    environment:
      DATABASE_URL: postgresql://kelbroo:${POSTGRES_PASSWORD}@postgres:5432/kelbroo?schema=public
      DIRECT_DATABASE_URL: postgresql://kelbroo:${POSTGRES_PASSWORD}@postgres:5432/kelbroo?schema=public
    depends_on:
      postgres:
        condition: service_healthy

  web-guest:
    build:
      context: .
      dockerfile: apps/web-guest/Dockerfile
      args:
        # Jawnie, mimo że kod ma tę samą wartość domyślną: niepodany ARG to
        # w Dockerze PUSTY łańcuch, więc obraz nie może polegać na tym, że
        # zmienna „nie istnieje".
        NEXT_PUBLIC_API_URL: /api
    restart: unless-stopped
    depends_on:
      - api

  web-marketing:
    build:
      context: .
      dockerfile: apps/web-marketing/Dockerfile
      args:
        # Odnośnik do demo prowadzi do aplikacji gościa; adres wkompilowuje się
        # w statyczną stronę, więc zmiana domeny wymaga przebudowania obrazu.
        NEXT_PUBLIC_GUEST_URL: https://${GUEST_DOMAIN}
    restart: unless-stopped

  web-backoffice:
    build:
      context: .
      dockerfile: apps/web-backoffice/Dockerfile
    restart: unless-stopped
    depends_on:
      - api

  web-admin:
    build:
      context: .
      dockerfile: apps/web-admin/Dockerfile
      args:
        # Patrz komentarz przy web-guest.
        NEXT_PUBLIC_API_URL: /api
        # Adres trafia do kodów QR drukowanych na stoliki, więc musi być
        # bezwzględny i znany w momencie budowania.
        NEXT_PUBLIC_GUEST_URL: https://${GUEST_DOMAIN}
    restart: unless-stopped
    depends_on:
      - api

volumes:
  postgres-data:
  redis-data:
  caddy-data:
  caddy-config:
